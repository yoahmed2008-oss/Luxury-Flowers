<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزهور الفاخرة</title>
    <!-- مكتبة أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- خط الكوفي (Noto Kufi Arabic) من Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700&display=swap">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Kufi Arabic', sans-serif;
        }

        body {
            background-color: #ded9d1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            color: #000000;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header-image {
            width: 100%;
            height: 220px;
            background-color: #e5dec9;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #797165;
        }

        .header-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .header-image i.star-icon {
            font-size: 24px;
            margin-bottom: 10px;
            color: #797165;
        }

        .header-image .placeholder-text {
            position: relative;
            z-index: 1;
            font-size: 16px;
            line-height: 1.6;
        }

        .content {
            padding: 30px 20px 20px 20px;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #000000;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 25px;
        }

        /* تصميم الأزرار ثلاثية الأبعاد 3D */
        .btn-link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
            user-select: none;
        }

        .btn-link:hover {
            filter: brightness(1.04);
            transform: translateY(-2px);
        }

        /* تأثير الانضغاط الواقعي للأسفل */
        .btn-link:active {
            transform: translateY(4px);
        }

        /* سناب شات 3D */
        .btn-snapchat {
            background-color: #FFFC00;
            color: #000000;
            box-shadow: 0 5px 0 #c7c400, 0 8px 15px rgba(0, 0, 0, 0.15);
        }
        .btn-snapchat:hover {
            box-shadow: 0 7px 0 #c7c400, 0 11px 18px rgba(0, 0, 0, 0.18);
        }
        .btn-snapchat:active {
            box-shadow: 0 1px 0 #c7c400, 0 3px 6px rgba(0, 0, 0, 0.15);
        }

        /* انستغرام 3D */
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            box-shadow: 0 5px 0 #9b1352, 0 8px 15px rgba(220, 39, 67, 0.25);
        }
        .btn-instagram:hover {
            box-shadow: 0 7px 0 #9b1352, 0 11px 18px rgba(220, 39, 67, 0.3);
        }
        .btn-instagram:active {
            box-shadow: 0 1px 0 #9b1352, 0 3px 6px rgba(220, 39, 67, 0.2);
        }

        /* واتساب 3D */
        .btn-whatsapp {
            background-color: #25d366;
            box-shadow: 0 5px 0 #179948, 0 8px 15px rgba(37, 211, 102, 0.25);
        }
        .btn-whatsapp:hover {
            box-shadow: 0 7px 0 #179948, 0 11px 18px rgba(37, 211, 102, 0.3);
        }
        .btn-whatsapp:active {
            box-shadow: 0 1px 0 #179948, 0 3px 6px rgba(37, 211, 102, 0.2);
        }

        /* تيك توك 3D */
        .btn-tiktok {
            background-color: #1c1c1c;
            box-shadow: 0 5px 0 #000000, 0 8px 15px rgba(0, 0, 0, 0.25);
        }
        .btn-tiktok:hover {
            box-shadow: 0 7px 0 #000000, 0 11px 18px rgba(0, 0, 0, 0.3);
        }
        .btn-tiktok:active {
            box-shadow: 0 1px 0 #000000, 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        .btn-link i {
            font-size: 20px;
        }

        .note {
            color: #000000;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .footer {
            color: #000000;
            font-size: 12px;
            border-top: 1px solid #f0f0f0;
            padding-top: 15px;
            line-height: 1.8;
        }

        .footer a {
            color: #000000;
            text-decoration: underline;
            font-weight: 700;
        }

        .footer a:hover {
            color: #25d366;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- الجزء الخاص بالصورة العلوية -->
        <div class="header-image">
            <img src="store.jpg" alt="" onerror="this.style.display='none'">
            <i class="fa-solid fa-diamond star-icon"></i>
            <div class="placeholder-text">
                <strong></strong><br>
            </div>
        </div>

        <!-- المحتوى الداخلي -->
        <div class="content">
            <h1 class="title">الزهور الفاخرة</h1>
            <p class="subtitle">أهلاً وسهلاً بكم<br>يسعدنا تواصلكم وزيارتكم</p>

            <div class="links-container">
                <!-- رابط سناب شات -->
                <a href="https://snapchat.com" target="_blank" class="btn-link btn-snapchat">
                    <i class="fa-brands fa-snapchat"></i>
                    <span>تابعونا على Snapchat</span>
                </a>

                <!-- رابط انستغرام -->
                <a href="https://instagram.com" target="_blank" class="btn-link btn-instagram">
                    <i class="fa-brands fa-instagram"></i>
                    <span>تابعونا على Instagram</span>
                </a>

                <!-- رابط واتساب -->
                <a href="https://wa.me/00000000000" target="_blank" class="btn-link btn-whatsapp">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>تواصلوا معنا عبر WhatsApp</span>
                </a>

                <!-- رابط تيك توك -->
                <a href="https://tiktok.com" target="_blank" class="btn-link btn-tiktok">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>تابعونا على TikTok</span>
                </a>
            </div>

            <p class="note">اضغط على الزر المناسب للوصول إلينا</p>
            <div class="footer">
                &copy; جميع الحقوق محفوظة لشركة عالم ساس للبرمجيات<br>
                <a href="https://t.me/alamsaas" target="_blank">@alamsaas</a>
            </div>
        </div>
    </div>

</body>
</html>
