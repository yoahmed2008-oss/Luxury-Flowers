<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نجوم الخليج للاحذية</title>
    <!-- مكتبة أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- خط تجوال من Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #ded9d1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header-image {
            width: 100%;
            height: 220px;
            background-color: #e5dec9;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #797165;
        }

        .header-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .header-image i.star-icon {
            font-size: 24px;
            margin-bottom: 10px;
            color: #797165;
        }

        .header-image .placeholder-text {
            position: relative;
            z-index: 1;
            font-size: 16px;
            line-height: 1.6;
        }

        .content {
            padding: 30px 20px 20px 20px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-link:hover {
            opacity: 0.92;
            transform: translateY(-2px);
        }

        /* ألوان الأزرار وفق التصميم */
        .btn-google {
            background-color: #3b82f6;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .btn-whatsapp {
            background-color: #25d366;
        }

        .btn-tiktok {
            background-color: #111111;
        }

        .btn-link i {
            font-size: 20px;
        }

        .note {
            color: #999;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .footer {
            color: #aaa;
            font-size: 12px;
            border-top: 1px solid #f0f0f0;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- الجزء الخاص بالصورة العلوية -->
        <div class="header-image">
            <img src="store.jpg" alt="صورة المتجر" onerror="this.style.display='none'">
            <i class="fa-solid fa-diamond star-icon"></i>
            <div class="placeholder-text">
                <strong>صورة المتجر</strong><br>
                استبدل هذه المساحة بصورتك باسم store.jpg
            </div>
        </div>

        <!-- المحتوى الداخلي -->
        <div class="content">
            <h1 class="title">نجوم الخليج للاحذية</h1>
            <p class="subtitle">أهلاً وسهلاً بكم<br>يسعدنا تواصلكم وزيارتكم</p>

            <div class="links-container">
                <!-- رابط خرائط جوجل -->
                <a href="https://maps.google.com" target="_blank" class="btn-link btn-google">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>موقعنا على خرائط Google</span>
                </a>

                <!-- رابط انستغرام -->
                <a href="https://instagram.com" target="_blank" class="btn-link btn-instagram">
                    <i class="fa-brands fa-instagram"></i>
                    <span>تابعونا على Instagram</span>
                </a>

                <!-- رابط واتساب -->
                <a href="https://wa.me/00000000000" target="_blank" class="btn-link btn-whatsapp">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>تواصلوا معنا عبر WhatsApp</span>
                </a>

                <!-- رابط تيك توك -->
                <a href="https://tiktok.com" target="_blank" class="btn-link btn-tiktok">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>تابعونا على TikTok</span>
                </a>
            </div>

            <p class="note">اضغط على الزر المناسب للوصول إلينا</p>
            <div class="footer">
                &copy; جميع الحقوق محفوظة شركة عالم ساس للبرمجيات
            </div>
        </div>
    </div>

</body>
</html>
